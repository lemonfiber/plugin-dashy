schema_version = 1

[plugin]
id          = "dashy"
name        = "Dashy"
version     = "0.1.0"
description = "One page linking everything, with live status"
without_it  = "Remember a dozen URLs and ports"
upstream    = "https://github.com/lissy93/dashy"
license     = "MIT"
forms       = ["full"]

[[service]]
id          = "dashy"
name        = "Dashy"
image       = "ghcr.io/lissy93/dashy"
digest      = "sha256:e8725dc24acc9a1d6f09c2ed0499b596af5a1b4eac8c83e912c213da06011356"
tag         = "4.9.0"
port        = 4000
bind        = "lan"
listens     = 8080
health      = { kind = "http", path = "/healthz", timeout_s = 60 }
criticality = "enhancing"
memory_mib  = 250
reaches     = ""
asks_for    = "Nothing. Its server's status check, ping check and proxy are turned off, so it asks no address anywhere."
config_path = "/app/user-data"
user_mode   = "uid"

[service.env]
DISABLE_PROXY_ENDPOINTS = "true"

[[proof]]
id      = "dashy.page"
service = "dashy"
title   = "Dashy serves the page lemonfiber wrote"
request = { method = "GET", path = "/conf.yml" }
expect  = { status = 200, json = { "/pageInfo/title" = "Home", "/appConfig/preventWriteToDisk" = true } }
fixture = "recordings/dashy/page.json"
why     = """
The dashboard is a page the browser draws from the configuration lemonfiber
writes. Dashy serving that file back, as written, is the pinned image reading
lemonfiber's page rather than one of its own, which a status alone could not
say of a page the browser draws.
"""

[[proof]]
id      = "dashy.save-refused"
service = "dashy"
title   = "Dashy refuses to save its page for anybody who asks"
request = { method = "POST", path = "/config-manager/save" }
expect  = { status = 403, json = { error = "Editing config has been disabled by your administrator" } }
fixture = "recordings/dashy/save-refused.json"
why     = """
The household reaches the page without signing in. A Dashy that saved what
any caller posted would let any device on the network rewrite the links
everybody follows. The page lemonfiber writes says preventWriteToDisk, so
Dashy refuses every save.
"""

[[proof]]
id      = "dashy.status-check-off"
service = "dashy"
title   = "Dashy's server checks no address it is handed"
request = { method = "GET", path = "/status-check?url=https%3A%2F%2Fexample.com%2F" }
expect  = { status = 403, json = { error = "This feature has been disabled by your administrator" } }
fixture = "recordings/dashy/status-check-off.json"
why     = """
Dashy's /status-check fetches whatever address its caller names, and the
household reaches the page without signing in, so it would let any device on
the network make this machine ask any address. DISABLE_PROXY_ENDPOINTS turns
it off, and the refusal names that switch rather than a failed fetch.
"""

[[proof]]
id      = "dashy.ping-check-off"
service = "dashy"
title   = "Dashy's server pings no host it is handed"
request = { method = "GET", path = "/ping-check?host=example.com" }
expect  = { status = 403, json = { error = "This feature has been disabled by your administrator" } }
fixture = "recordings/dashy/ping-check-off.json"
why     = """
Dashy's /ping-check pings whatever host its caller names, for anybody who
reaches the page. DISABLE_PROXY_ENDPOINTS turns it off, and the refusal names
that switch rather than a host that did not answer.
"""

[[proof]]
id      = "dashy.cors-proxy-off"
service = "dashy"
title   = "Dashy's server forwards no request"
request = { method = "GET", path = "/cors-proxy" }
expect  = { status = 403, json = { error = "This feature has been disabled by your administrator" } }
fixture = "recordings/dashy/cors-proxy-off.json"
why     = """
Dashy's /cors-proxy forwards any request to the address in its Target-URL
header, for anybody who reaches the page. DISABLE_PROXY_ENDPOINTS turns it
off ahead of the handler: the refusal names that switch before any header is
read, where the handler would have answered that no Target-URL was given.
"""

[[ask]]
service    = "dashy"
capability = "proxy.front"

[[wiring]]
service  = "dashy"
hostname = "dash"
